services:
  db:
    image: postgres:15-alpine
    container_name: sin_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sin_internal
      - sin_scan
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: sin_redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --save 60 1000
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sin_internal
      - sin_scan

  api:
    build: .
    container_name: sin_api
    cap_add:
      - NET_RAW
      - NET_ADMIN
    command: >
      sh -c "python -c 'from sin.storage.init_db import init_db; init_db()' &&
             uvicorn sin.api.server:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SIN_DB_HOST=db
      - SIN_DB_PORT=5432
      - SIN_DB_USER=${POSTGRES_USER}
      - SIN_DB_PASSWORD=${POSTGRES_PASSWORD}
      - SIN_DB_NAME=${POSTGRES_DB}
      - SIN_REDIS_HOST=redis
      - SIN_REDIS_PORT=6379
      - SIN_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SIN_API_KEY=${SIN_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SIN_GATEWAY_IP=192.168.30.1
      - DRY_RUN=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - sin_internal
      - sin_scan
    volumes:
      - /var/lib/sin:/var/lib/sin
      - ./src:/app/src
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

  worker:
    build: .
    container_name: sin_worker
    command: celery -A sin.tasks.celery_app worker --loglevel=info --concurrency=4 --queues=scan,celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    network_mode: host
    environment:
      - SIN_DB_HOST=localhost
      - SIN_DB_PORT=5433
      - SIN_DB_USER=${POSTGRES_USER}
      - SIN_DB_PASSWORD=${POSTGRES_PASSWORD}
      - SIN_DB_NAME=${POSTGRES_DB}
      - SIN_REDIS_HOST=localhost
      - SIN_REDIS_PORT=6380
      - SIN_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SIN_API_KEY=${SIN_API_KEY}
      - SIN_SCAN_SUBNET=${SIN_SCAN_SUBNET}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SIN_GATEWAY_IP=192.168.30.1
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - /var/lib/sin:/var/lib/sin
      - ./src:/app/src
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 256M
    restart: unless-stopped

  beat:
    build: .
    container_name: sin_beat
    command: >
      celery -A sin.tasks.celery_app beat
      -S redbeat.RedBeatScheduler
      --loglevel=info
    depends_on:
      - redis
    environment:
      SIN_DB_HOST: db
      SIN_DB_USER: ${POSTGRES_USER}
      SIN_DB_PASSWORD: ${POSTGRES_PASSWORD}
      SIN_DB_NAME: ${POSTGRES_DB}
      SIN_REDIS_HOST: redis
      SIN_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SIN_SCAN_SUBNET: ${SIN_SCAN_SUBNET}
    restart: unless-stopped
    networks:
      - sin_internal

  dashboard:
    image: nginx:alpine
    container_name: sin_dashboard
    ports:
      - "8501:80"
    volumes:
      - ./src/sin/ui/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - sin_internal
      - sin_scan

volumes:
  postgres_data:
  redis_data:

networks:
  sin_internal:
    driver: bridge
    internal: true
  sin_scan:
    driver: bridge
